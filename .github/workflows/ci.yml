name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install compile SDK
        # `yes` takes a broken pipe when sdkmanager stops reading; under the
        # runner's pipefail that would fail the step, so tolerate it — the
        # Gradle build below is the real gate on the SDK being present.
        run: yes | sdkmanager "platforms;android-37" > /dev/null || true
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Spotless, detekt, unit tests
        run: ./gradlew spotlessCheck detekt testDebugUnitTest --no-daemon --stacktrace

  pi-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Ruff
        # Pinned so CI lints with the same ruff developers run locally, not a
        # moving pipx "latest" whose default rule set drifts.
        run: pipx run ruff==0.15.15 check pi/
      - name: Unit tests
        working-directory: pi
        run: python -m unittest -v
