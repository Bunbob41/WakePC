<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
  <style>
    body { margin: 0; background: #0b0d0f; }
    a { color: #45d06d; } a:hover { color: #6fe392; }
    @keyframes wake-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #0b0d0f; color: #e6e3dc; font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box;">

  <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 30px 20px 20px 20px;">

    <div style="font-size: 10px; color: #5f6871; letter-spacing: 1.5px;">2 CONNECTIONS</div>
  </div>

  <div style="margin: 0 20px; border: 1px solid #1e242a; background: #101315; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: center; gap: 9px; font-size: 11px;">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: #ff5d49; box-shadow: 0 0 6px 1px rgba(255, 93, 73, 0.55);"></span>
      <span style="color: #aab2b9;">my pi</span>
      <span style="margin-left: auto; color: #45d06d;">online · 14ms</span>

      <span style="width: 7px; height: 7px; border-radius: 50%; background: #45d06d; box-shadow: 0 0 6px 1px rgba(69, 208, 109, 0.55);"></span>

      <span style="margin-left: auto; color: #45d06d;">online · 41ms</span>
    </div>
    <div style="display: flex; align-items: center; gap: 9px; font-size: 11px; border-top: 1px solid #14181c; padding-top: 12px;">
      <span style="color: #3a434c;">last run</span>
      <span style="margin-left: auto; color: #5f6871;">wake pc · 2h ago</span>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 0 20px 8px 20px; text-align: right; font-size: 11px; color: #5f6871;">+ add button</div>

  <div style="display: flex; flex-direction: column; padding-bottom: 18px;">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 68px; border-top: 1px solid #14181c;">
      <div style="display: flex; align-items: center; gap: 11px;">
        <span style="width: 7px; height: 7px; border-radius: 50%; background: #ff5d49; box-shadow: 0 0 6px 1px rgba(255, 93, 73, 0.55);"></span>
        <span style="font-size: 15px;">Reboot Pi</span>
      </div>
      <div style="font-size: 10px; color: #3a434c; letter-spacing: 1.5px;">RUN</div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 68px; border-top: 1px solid #14181c;">
      <div style="display: flex; align-items: center; gap: 11px;">
        <span style="width: 7px; height: 7px; border-radius: 50%; background: #ff5d49; box-shadow: 0 0 6px 1px rgba(255, 93, 73, 0.55);"></span>
        <span style="font-size: 15px;">Suspend PC</span>
      </div>
      <div style="font-size: 10px; color: #3a434c; letter-spacing: 1.5px;">RUN</div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 68px; border-top: 1px solid #14181c;">
      <div style="display: flex; align-items: center; gap: 11px;">
        <span style="width: 7px; height: 7px; border-radius: 50%; background: #45d06d; box-shadow: 0 0 6px 1px rgba(69, 208, 109, 0.55);"></span>
        <span style="font-size: 15px;">Wake Paul's PC</span>
      </div>
      <div style="font-size: 10px; color: #e2a63d; letter-spacing: 1.5px; text-shadow: 0 0 8px rgba(226, 166, 61, 0.8); animation: wake-pulse 1.6s ease-in-out infinite;">WAKING · 0:12</div>
    </div>
    <div style="margin: 14px 20px 0 20px; border: 1px solid #2b4a36; background: #101712; border-radius: 8px; height: 74px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; box-sizing: border-box;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="width: 9px; height: 9px; border-radius: 50%; background: #ff5d49; box-shadow: 0 0 8px 1px rgba(255, 93, 73, 0.6);"></span>

      <div style="font-size: 11px; color: #45d06d; letter-spacing: 1.5px; text-shadow: 0 0 10px rgba(69, 208, 109, 0.75);">AWAKE</div>
    </div>
  </div>

</div>
</x-dc>
