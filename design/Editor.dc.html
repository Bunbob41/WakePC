<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
  <style>
    body { margin: 0; background: #0b0d0f; }
    a { color: #45d06d; } a:hover { color: #6fe392; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #0b0d0f; color: #e6e3dc; font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box;">

  <div style="display: flex; align-items: center; gap: 14px; padding: 30px 20px 24px 20px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5f6871" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6"></path>
    </svg>
    <div style="font-size: 14px; font-weight: 700; letter-spacing: 2px;">NEW BUTTON</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 22px; padding: 0 20px;">

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <div style="font-size: 10px; letter-spacing: 2px; color: #5f6871;">LABEL</div>
      <div style="border: 1px solid #1e242a; background: #101315; border-radius: 4px; padding: 13px 14px; font-size: 14px;">Wake PC</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <div style="font-size: 10px; letter-spacing: 2px; color: #5f6871;">CONNECTION</div>
      <div style="display: flex; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 7px; border: 1px solid #ff5d49; background: #1c1210; border-radius: 4px; padding: 9px 13px; font-size: 12px; color: #e6e3dc;">
          <span style="width: 7px; height: 7px; background: #ff5d49; border-radius: 1px;"></span>my pi
        </div>
        <div style="display: flex; align-items: center; gap: 7px; border: 1px solid #1e242a; background: #101315; border-radius: 4px; padding: 9px 13px; font-size: 12px; color: #5f6871;">
          <span style="width: 7px; height: 7px; background: #45d06d; border-radius: 1px;"></span>pauls pi
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <div style="font-size: 10px; letter-spacing: 2px; color: #5f6871;">COMMANDS ON MY PI</div>

      <div style="display: flex; align-items: center; gap: 12px; border: 1px solid #2b4a36; background: #101712; border-radius: 4px; padding: 14px;">
        <svg width="16" height="16" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" fill="none" stroke="#45d06d" stroke-width="2"></circle>
          <circle cx="12" cy="12" r="4.5" fill="#45d06d"></circle>
        </svg>
        <span style="font-size: 13px;">wake-pc</span>
        <span style="margin-left: auto; font-size: 10px; letter-spacing: 1.5px; color: #45d06d;">PING</span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; border: 1px solid #1e242a; background: #101315; border-radius: 4px; padding: 14px;">
        <svg width="16" height="16" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" fill="none" stroke="#3a434c" stroke-width="2"></circle>
        </svg>
        <span style="font-size: 13px; color: #8a9096;">reboot-pi</span>
      </div>

      <div style="font-size: 11px; color: #3a434c; line-height: 1.6;">fetched from my pi — add commands in its config file</div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #14181c; padding-top: 20px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 13px;">quick settings tile</span>
        <span style="font-size: 10px; color: #5f6871;">fires this button from the shade</span>
      </div>
      <div style="width: 42px; height: 24px; border-radius: 12px; background: #45d06d; display: flex; align-items: center; justify-content: flex-end; padding: 3px; box-sizing: border-box;">
        <span style="width: 18px; height: 18px; border-radius: 50%; background: #0b0d0f;"></span>
      </div>
    </div>

  </div>

  <div style="margin: auto 20px 28px 20px; background: #e6e3dc; color: #0b0d0f; border-radius: 4px; padding: 16px; text-align: center; font-size: 13px; font-weight: 700; letter-spacing: 1px;">save button</div>

</div>
</x-dc>
</body>
</html>
