<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
  <style>
    body { margin: 0; background: #0b0d0f; }
    a { color: #45d06d; } a:hover { color: #6fe392; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: linear-gradient(180deg, #0d0f12 0%, #0b0d0f 120px); color: #e6e3dc; font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box;">

  <div style="display: flex; align-items: center; gap: 14px; padding: 30px 20px 26px 20px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5f6871" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6"></path>
    </svg>
    <div style="font-size: 13px; font-weight: 700; letter-spacing: 3px;">NEW CONNECTION</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 20px; padding: 0 20px;">

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 10px; letter-spacing: 2px; color: #5f6871;">NAME</div>
      <div style="border: 1px solid #1e242a; background: #101315; border-radius: 6px; padding: 13px 14px; font-size: 14px;">my pi</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 10px; letter-spacing: 2px; color: #5f6871;">COLOR</div>
      <div style="display: flex; gap: 10px;">
        <span style="width: 34px; height: 34px; border-radius: 6px; background: #ff5d49; box-shadow: 0 0 10px rgba(255, 93, 73, 0.45); outline: 2px solid #e6e3dc; outline-offset: 3px;"></span>
        <span style="width: 34px; height: 34px; border-radius: 6px; background: #45d06d;"></span>
        <span style="width: 34px; height: 34px; border-radius: 6px; background: #e2a63d;"></span>
        <span style="width: 34px; height: 34px; border-radius: 6px; background: #4aa3ff;"></span>
        <span style="width: 34px; height: 34px; border-radius: 6px; background: #a06bff;"></span>
        <span style="width: 34px; height: 34px; border-radius: 6px; background: #3ecfc0;"></span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 10px; letter-spacing: 2px; color: #5f6871;">ADDRESS</div>
      <div style="border: 1px solid #1e242a; background: #101315; border-radius: 6px; padding: 13px 14px; font-size: 14px;">http://homepi:8787</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 10px; letter-spacing: 2px; color: #5f6871;">FALLBACK ADDRESS · OPTIONAL</div>
      <div style="border: 1px solid #1e242a; background: #101315; border-radius: 6px; padding: 13px 14px; font-size: 14px; color: #8a9096;">http://100.64.0.2:8787</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 10px; letter-spacing: 2px; color: #5f6871;">TOKEN</div>
      <div style="border: 1px solid #1e242a; background: #101315; border-radius: 6px; padding: 13px 14px; font-size: 14px; letter-spacing: 3px; color: #8a9096;">••••••••••••••••</div>
    </div>

    <div style="border: 1px solid #2b4a36; background: #101712; border-radius: 6px; padding: 14px; text-align: center; font-size: 13px; color: #45d06d; letter-spacing: 1px;">test connection</div>

    <div style="display: flex; align-items: center; gap: 9px; font-size: 12px; color: #45d06d;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#45d06d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5"></path>
      </svg>
      ok — found 3 commands: wake-pc, suspend-pc, reboot-pi
    </div>

  </div>

  <div style="margin: auto 20px 28px 20px; background: #e6e3dc; color: #0b0d0f; border-radius: 8px; padding: 17px; text-align: center; font-size: 13px; font-weight: 700; letter-spacing: 1px;">save connection</div>

</div>
</x-dc>
</body>
</html>
