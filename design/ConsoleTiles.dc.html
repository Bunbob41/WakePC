<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
  <style>
    body { margin: 0; background: #0b0d0f; }
    a { color: #45d06d; } a:hover { color: #6fe392; }
    @keyframes wake-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #0b0d0f; color: #e6e3dc; font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box;">

  <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 30px 20px 20px 20px;">
    <div style="font-size: 13px; font-weight: 700; letter-spacing: 4px;">WAKEPC</div>
    <div style="font-size: 10px; color: #5f6871; letter-spacing: 1.5px;">2 CONNECTIONS</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; padding: 0 20px;">

    <div style="height: 140px; border: 1px solid #1e242a; background: #101315; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-between; padding: 14px; box-sizing: border-box;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="width: 9px; height: 9px; border-radius: 50%; background: #ff5d49; box-shadow: 0 0 8px 1px rgba(255, 93, 73, 0.6);"></span>
        <span style="font-size: 9px; letter-spacing: 2px; color: #5f6871;">MY PI</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <div style="font-size: 15px; font-weight: 500;">Wake PC</div>
        <div style="font-size: 10px; letter-spacing: 1.5px; color: #45d06d; text-shadow: 0 0 8px rgba(69, 208, 109, 0.7);">AWAKE</div>
      </div>
    </div>

    <div style="height: 140px; border: 1px solid #1e242a; background: #101315; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-between; padding: 14px; box-sizing: border-box;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="width: 9px; height: 9px; border-radius: 50%; background: #ff5d49; box-shadow: 0 0 8px 1px rgba(255, 93, 73, 0.6);"></span>
        <span style="font-size: 9px; letter-spacing: 2px; color: #5f6871;">MY PI</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <div style="font-size: 15px; font-weight: 500;">Suspend PC</div>
        <div style="font-size: 10px; letter-spacing: 1.5px; color: #3a434c;">READY</div>
      </div>
    </div>

    <div style="height: 140px; border: 1px solid #1e242a; background: #101315; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-between; padding: 14px; box-sizing: border-box;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="width: 9px; height: 9px; border-radius: 50%; background: #ff5d49; box-shadow: 0 0 8px 1px rgba(255, 93, 73, 0.6);"></span>
        <span style="font-size: 9px; letter-spacing: 2px; color: #5f6871;">MY PI</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <div style="font-size: 15px; font-weight: 500;">Reboot Pi</div>
        <div style="font-size: 10px; letter-spacing: 1.5px; color: #3a434c;">READY</div>
      </div>
    </div>

    <div style="height: 140px; border: 1px solid #3a2a17; background: #14100b; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-between; padding: 14px; box-sizing: border-box;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="width: 9px; height: 9px; border-radius: 50%; background: #45d06d; box-shadow: 0 0 10px 2px rgba(69, 208, 109, 0.65); animation: wake-pulse 1.4s ease-in-out infinite;"></span>
        <span style="font-size: 9px; letter-spacing: 2px; color: #5f6871;">PAULS PI</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <div style="font-size: 15px; font-weight: 500;">Wake Paul's PC</div>
        <div style="font-size: 10px; letter-spacing: 1.5px; color: #e2a63d; text-shadow: 0 0 8px rgba(226, 166, 61, 0.75);">WAKING · 0:12</div>
      </div>
    </div>

    <div style="height: 140px; border: 1px dashed #242b31; border-radius: 8px; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">
      <span style="font-size: 22px; color: #4c5157;">+</span>
    </div>
  </div>

  <div style="margin: auto 20px 26px 20px; border: 1px solid #1e242a; background: #101315; border-radius: 8px; padding: 12px 16px; display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 1.5px; color: #8a9096;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: #ff5d49; box-shadow: 0 0 6px 1px rgba(255, 93, 73, 0.55);"></span>MY PI · ONLINE
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: #45d06d; box-shadow: 0 0 6px 1px rgba(69, 208, 109, 0.55);"></span>PAULS PI · ONLINE
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
